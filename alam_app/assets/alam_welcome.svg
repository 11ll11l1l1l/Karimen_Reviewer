<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ALAM welcome illustration</title>
<desc id="desc">A calm sunrise over Japan with mountains, a city, a notebook, and a compass-like ALAM symbol representing seeing, understanding, and acting.</desc>
<defs>
