name: ALAM app checks

on:
  push:
    branches: [main]
    paths:
      - 'alam_app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/alam-checks.yml'
      - '.github/workflows/alam-editorial-images.yml'
      - '.github/workflows/alam-supabase-sync.yml'
  pull_request:
    paths:
      - 'alam_app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/alam-checks.yml'
      - '.github/workflows/alam-editorial-images.yml'
      - '.github/workflows/alam-supabase-sync.yml'

jobs:
  validate-alam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Validate ALAM production data
        run: python alam_app/validate_alam_data.py
      - name: Editorial image pipeline self-test
        run: python alam_app/alam_image_generation.py --self-test
      - name: Install ALAM dependencies
        run: pip install -r alam_app/requirements.txt
      - name: Article image fallback regression test
        run: python alam_app/test_article_image_render.py
      - name: Reliable layered image renderer regression test
        run: python alam_app/test_reliable_image_renderer.py
      - name: Supabase reconciliation helper regression test
        run: python alam_app/test_alam_supabase_reconcile.py
      - name: Supabase multi-table partial-write recovery test
        run: python alam_app/test_alam_multitable_recovery.py
      - name: Supabase source sync failure-injection test
        run: python alam_app/test_alam_source_sync.py
      - name: Supabase topic sync failure-injection test
        run: python alam_app/test_alam_topic_sync.py
      - name: Publication evidence quality gate test
        run: python alam_app/test_alam_publication_quality.py
      - name: Story lifecycle reactivation safety test
        run: python alam_app/test_alam_lifecycle.py
      - name: Article version migration regression test
        run: python alam_app/test_alam_article_version_migration.py
      - name: Article version concurrency regression test
        run: python alam_app/test_alam_article_version_concurrency.py
      - name: Supabase readiness regression test
        run: python alam_app/test_alam_supabase_health.py
      - name: Product readiness presentation regression test
        run: python alam_app/test_alam_readiness_views.py
      - name: Evidence trust-view regression test
        run: python alam_app/test_alam_evidence_views.py
      - name: Saved material-update review regression test
        run: python alam_app/test_alam_saved_update_flow.py
      - name: Comment hydration scope regression test
        run: python alam_app/test_alam_comment_scope.py
      - name: Comment reply integrity regression test
        run: python alam_app/test_alam_comment_reply_integrity.py
      - name: Article history scope regression test
        run: python alam_app/test_alam_article_scope.py
      - name: Persistent device recognition regression test
        run: python alam_app/test_alam_identity_persistence.py
      - name: Optional account Auth contract regression test
        run: python alam_app/test_alam_auth_contract.py
      - name: Live linked-account read mirror regression test
        run: python alam_app/test_alam_live_read_mirror.py
      - name: Accessibility contract regression test
        run: python alam_app/test_alam_accessibility.py
      - name: Verified audit overlay regression test
        run: python alam_app/test_alam_hybrid_feed.py
      - name: Compact mobile shell regression test
        run: python alam_app/test_alam_mobile_shell.py
      - name: Python syntax check — every ALAM module
        run: python -m compileall -q alam_app
      - name: Start ALAM Streamlit server
        shell: bash
        run: |
          streamlit run alam_app/streamlit_app.py --server.headless=true --server.port=8512 > /tmp/alam-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8512/_stcore/health >/dev/null; then
              echo 'ALAM health check passed'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alam-streamlit.log
          exit 1
