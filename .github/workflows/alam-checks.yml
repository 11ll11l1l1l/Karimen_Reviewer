name: ALAM app checks

on:
  push:
    branches: [main]
    paths:
      - 'alam_app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/alam-checks.yml'
      - '.github/workflows/alam-editorial-images.yml'
      - '.github/workflows/alam-supabase-sync.yml'
  pull_request:
    paths:
      - 'alam_app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/alam-checks.yml'
      - '.github/workflows/alam-editorial-images.yml'
      - '.github/workflows/alam-supabase-sync.yml'

jobs:
  validate-alam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Validate ALAM production data
        run: python alam_app/validate_alam_data.py
      - name: Editorial image pipeline self-test
        run: python alam_app/alam_image_generation.py --self-test
      - name: Install ALAM dependencies
        run: pip install -r alam_app/requirements.txt
      - name: Article image fallback regression test
        run: python alam_app/test_article_image_render.py
      - name: Reliable layered image renderer regression test
        run: python alam_app/test_reliable_image_renderer.py
      - name: Python syntax check
        run: >-
          python -m py_compile
          alam_app/streamlit_app.py
          alam_app/alam_core.py
          alam_app/alam_personas.py
          alam_app/alam_views.py
          alam_app/alam_mobile_views.py
          alam_app/alam_market_views.py
          alam_app/alam_visual_system.py
          alam_app/alam_editorial_visual.py
          alam_app/alam_generated_images.py
          alam_app/alam_image_generation.py
          alam_app/alam_image_renderer.py
          alam_app/alam_time_theme.py
          alam_app/alam_time_headers.py
          alam_app/alam_extras.py
          alam_app/alam_intelligence.py
          alam_app/alam_local_state.py
          alam_app/alam_reader_views.py
          alam_app/alam_supabase.py
          alam_app/alam_supabase_ingest.py
          alam_app/alam_supabase_views.py
          alam_app/test_article_image_render.py
          alam_app/test_reliable_image_renderer.py
          alam_app/validate_alam_data.py
      - name: Start ALAM Streamlit server
        shell: bash
        run: |
          streamlit run alam_app/streamlit_app.py --server.headless=true --server.port=8512 > /tmp/alam-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8512/_stcore/health >/dev/null; then
              echo 'ALAM health check passed'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alam-streamlit.log
          exit 1
