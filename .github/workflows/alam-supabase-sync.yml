name: ALAM Supabase sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alam_app/data/discover/**'
      - 'alam_app/data/practical/**'
      - 'alam_app/data/reflection/**'
      - 'alam_app/data/trend/**'
      - 'alam_app/data/comments/**'
      - 'alam_app/data/wisdom/**'
      - 'alam_app/alam_lifecycle.py'
      - 'alam_app/alam_supabase_ingest.py'
      - 'alam_app/alam_supabase_reconcile.py'
      - 'alam_app/alam_supabase_sync_job.py'
      - 'alam_app/validate_alam_data.py'
      - '.github/workflows/alam-supabase-sync.yml'

concurrency:
  group: alam-supabase-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate ALAM audit data
        run: python alam_app/validate_alam_data.py

      - name: Detect trusted Supabase credentials
        id: supabase_credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ready=true
          if [[ -z "$SUPABASE_URL" ]]; then
            ready=false
            echo "::warning::Missing repository Actions secret SUPABASE_URL. Audit-data validation passed, but GitHub Actions cannot run the trusted Supabase mirror."
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" && -z "$SUPABASE_SECRET_KEY" ]]; then
            ready=false
            echo "::warning::Missing trusted Supabase backend credential. Configure SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY to enable GitHub-hosted synchronization."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "Trusted Supabase credentials are configured; database mirror will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Supabase mirror skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository audit-data validation succeeded, but trusted Supabase credentials are not configured in GitHub Actions. This known external blocker is reported without turning every content-only push into a false-red CI run." >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::A manually requested Supabase sync cannot proceed without trusted credentials."
              exit 1
            fi
          fi

      - name: Install Supabase client
        if: steps.supabase_credentials.outputs.ready == 'true'
        run: pip install -r alam_app/requirements.txt

      - name: Sync verified ALAM records to Supabase
        if: steps.supabase_credentials.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python alam_app/alam_supabase_sync_job.py
