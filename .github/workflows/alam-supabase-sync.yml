name: ALAM Supabase sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alam_app/data/discover/**'
      - 'alam_app/data/practical/**'
      - 'alam_app/data/reflection/**'
      - 'alam_app/data/trend/**'
      - 'alam_app/data/comments/**'
      - 'alam_app/data/wisdom/**'
      - 'alam_app/alam_lifecycle.py'
      - 'alam_app/alam_supabase_ingest.py'
      - 'alam_app/alam_supabase_reconcile.py'
      - 'alam_app/alam_supabase_sync_job.py'
      - 'alam_app/validate_alam_data.py'
      - '.github/workflows/alam-supabase-sync.yml'

concurrency:
  group: alam-supabase-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate ALAM audit data
        run: python alam_app/validate_alam_data.py

      - name: Check trusted Supabase credentials
        id: supabase-creds
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Trusted Supabase credentials are configured; database mirror will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Trusted Supabase GitHub secrets are not configured. Audit data is valid; database publication is skipped rather than reported as a failed sync."
          fi

      - name: Install Supabase client
        if: steps.supabase-creds.outputs.available == 'true'
        run: pip install -r alam_app/requirements.txt

      - name: Sync verified ALAM records to Supabase
        if: steps.supabase-creds.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # With trusted credentials, run the full incremental mirror plus deterministic
        # reconciliation. Missing credentials are handled above as validation-only mode;
        # they must never be mistaken for either a successful database write or a CI failure.
        run: python alam_app/alam_supabase_sync_job.py

      - name: Validation-only mode
        if: steps.supabase-creds.outputs.available != 'true'
        run: |
          echo "ALAM audit data validated successfully."
          echo "GitHub-to-Supabase trusted mirror skipped because repository secrets are unavailable."
          echo "The connected ALAM agent/reconciliation path may publish the same validated payload directly to Supabase."
