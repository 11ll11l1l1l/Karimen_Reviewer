name: ALAM Supabase sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Reject stale main snapshot
        shell: bash
        run: |
          # Re-running an old Actions run after a newer content sync can otherwise
          # reconcile Supabase back to that old GitHub archive. Keep queued runs
          # serialized, but fail closed before expensive validation/setup when this
          # checkout is already no longer the current main head.
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$CURRENT_MAIN" ]]; then
            echo "::error::Refusing stale ALAM sync: workflow SHA $GITHUB_SHA is not current main $CURRENT_MAIN."
            echo "### Stale Supabase sync rejected" >> "$GITHUB_STEP_SUMMARY"
            echo "A newer main commit exists. This run will not reconcile an older archive into durable Supabase state." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Sync snapshot matches current main: $CURRENT_MAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate ALAM audit data
        run: python alam_app/validate_alam_data.py

      - name: Require trusted Supabase credential
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" && -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Missing trusted Supabase backend credential. Configure SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY."
            echo "### Supabase sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Trusted Supabase credentials are required for every main-branch ALAM sync. Audit validation passed, but the database was not modified." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Trusted Supabase credential is configured; canonical sync will run." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Supabase client
        run: pip install -r alam_app/requirements.txt

      - name: Recheck main immediately before Supabase write
        shell: bash
        run: |
          # Close the TOCTOU window between the early freshness check and the
          # durable reconciliation write. A newer main commit can arrive while
          # validation or dependency installation is running.
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$CURRENT_MAIN" ]]; then
            echo "::error::Refusing superseded ALAM sync immediately before write: workflow SHA $GITHUB_SHA is not current main $CURRENT_MAIN."
            echo "### Superseded Supabase sync rejected before write" >> "$GITHUB_STEP_SUMMARY"
            echo "Main advanced after this run started. No durable Supabase reconciliation was attempted by this snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Pre-write sync snapshot still matches current main: $CURRENT_MAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync verified ALAM records to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python alam_app/alam_supabase_sync_job.py
