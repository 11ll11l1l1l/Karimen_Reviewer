name: ALAM Supabase sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alam_app/data/discover/**'
      - 'alam_app/data/practical/**'
      - 'alam_app/data/reflection/**'
      - 'alam_app/data/trend/**'
      - 'alam_app/data/comments/**'
      - 'alam_app/data/wisdom/**'
      - 'alam_app/alam_lifecycle.py'
      - 'alam_app/alam_supabase_ingest.py'
      - 'alam_app/alam_supabase_reconcile.py'
      - 'alam_app/alam_supabase_sync_job.py'
      - 'alam_app/validate_alam_data.py'
      - '.github/workflows/alam-supabase-sync.yml'

concurrency:
  group: alam-supabase-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate ALAM audit data
        run: python alam_app/validate_alam_data.py

      - name: Require trusted Supabase credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::Missing repository Actions secret SUPABASE_URL. ALAM cannot mirror GitHub audit records to Supabase."
            exit 1
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" && -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Missing trusted Supabase backend credential. Configure SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY as a repository Actions secret."
            exit 1
          fi
          echo "Trusted Supabase credentials are configured; database mirror will run."

      - name: Install Supabase client
        run: pip install -r alam_app/requirements.txt

      - name: Sync verified ALAM records to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python alam_app/alam_supabase_sync_job.py
