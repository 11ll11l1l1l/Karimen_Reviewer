name: ALAM Supabase sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alam_app/data/discover/**'
      - 'alam_app/data/practical/**'
      - 'alam_app/data/reflection/**'
      - 'alam_app/data/trend/**'
      - 'alam_app/data/comments/**'
      - 'alam_app/data/wisdom/**'
      - 'alam_app/alam_lifecycle.py'
      - 'alam_app/alam_supabase_ingest.py'
      - 'alam_app/alam_supabase_reconcile.py'
      - 'alam_app/alam_supabase_sync_job.py'
      - 'alam_app/validate_alam_data.py'
      - '.github/workflows/alam-supabase-sync.yml'

concurrency:
  group: alam-supabase-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The project URL is public configuration, not a credential. Keeping it here
  # removes one unnecessary secret and leaves only the trusted backend key to configure.
  SUPABASE_URL: https://zecztyabmmoqzjumhxxf.supabase.co

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate ALAM audit data
        run: python alam_app/validate_alam_data.py

      - name: Check trusted Supabase credential
        id: supabase-credential
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" && -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "### Supabase sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Trusted Supabase credentials are unavailable, so the database was not modified." >> "$GITHUB_STEP_SUMMARY"

            # An explicit operator-requested sync must fail closed: reporting success here
            # would falsely claim that a requested mirror operation happened. Ordinary
            # content pushes are different; the missing secret is a known external blocker,
            # so repeatedly failing otherwise-valid content commits only creates a false-red
            # loop. Those pushes retain the validated GitHub audit record and skip the
            # trusted mirror until credentials are configured.
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Missing trusted Supabase backend credential. Configure SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY."
              exit 1
            fi

            echo "::warning::Trusted Supabase backend credential is not configured; validated audit data will remain GitHub-only for this push."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Trusted Supabase credential is configured; canonical sync will run." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Supabase client
        if: steps.supabase-credential.outputs.available == 'true'
        run: pip install -r alam_app/requirements.txt

      - name: Sync verified ALAM records to Supabase
        if: steps.supabase-credential.outputs.available == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python alam_app/alam_supabase_sync_job.py
