name: Japan Driving License Reviewer v5.3 checks

on:
  push:
    paths-ignore:
      - 'alam_app/data/**'
  pull_request:
    paths-ignore:
      - 'alam_app/data/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Workflow isolation regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          assert workflow.count("- 'alam_app/data/**'") >= 2, (
              'Reviewer CI must ignore ALAM content-only pushes and pull requests; '
              'ALAM data validation/sync is owned by the ALAM workflows.'
          )
          PY
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py karimen_core.py
      - name: Validate question bank
        run: python validate.py
      - name: Release compatibility audit
        run: python release_audit.py
      - name: Core + v5.3 regressions
        run: |
          python smoke_test.py
          python runtime_stub_test.py
          python strict_runtime_test.py
          python supabase_stub_test.py
      - name: Streamlit AppTest
        run: python streamlit_apptest.py
      - name: Start real Streamlit server
        shell: bash
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/jdl-reviewer-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              echo 'Streamlit health check passed.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jdl-reviewer-streamlit.log
          exit 1
