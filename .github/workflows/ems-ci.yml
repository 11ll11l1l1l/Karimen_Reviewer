name: EMS production-core checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'ems/**'
    paths:
      - 'equipment_manager/**'
      - '.github/workflows/ems-ci.yml'
  pull_request:
    paths:
      - 'equipment_manager/**'
      - '.github/workflows/ems-ci.yml'

jobs:
  ems-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EMS test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3"
      - name: Compile EMS source
        run: python -m compileall -q equipment_manager
      - name: Run EMS production-core tests
        env:
          PYTHONPATH: equipment_manager
        run: python -m unittest discover -s equipment_manager/tests -v
