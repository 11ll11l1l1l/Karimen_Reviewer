name: EMS production-core checks

on:
  workflow_dispatch:
  push:
    branches:
      - 'ems/**'
    paths:
      - 'equipment_manager/**'
      - '.github/workflows/ems-ci.yml'
  pull_request:
    paths:
      - 'equipment_manager/**'
      - '.github/workflows/ems-ci.yml'

jobs:
  ems-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ems_test
          POSTGRES_USER: ems_test
          POSTGRES_PASSWORD: ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems_test -d ems_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EMS test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3" "psycopg[binary]>=3.2,<4" "pandas>=2.2,<3" "openpyxl>=3.1,<4" "python-pptx>=1.0,<2"
      - name: Compile EMS source
        run: python -m compileall -q equipment_manager
      - name: Run EMS SQLite and PostgreSQL production-core tests
        env:
          PYTHONPATH: equipment_manager
          EMS_TEST_POSTGRES_URL: postgresql+psycopg://ems_test:ems_test@127.0.0.1:5432/ems_test
        run: python -m unittest discover -s equipment_manager/tests -v


  ems-large-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EMS stress dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3" "psycopg[binary]>=3.2,<4" "pandas>=2.2,<3" "openpyxl>=3.1,<4" "python-pptx>=1.0,<2"
      - name: Run 100k equipment-history performance gate
        env:
          PYTHONPATH: equipment_manager
          EMS_RUN_STRESS: '1'
        run: python equipment_manager/tests/test_m14_stress.py

  windows-gui-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: equipment_manager/requirements.txt
      - name: Install full EMS desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r equipment_manager/requirements.txt
      - name: Compile EMS desktop source
        run: python -m compileall -q equipment_manager
      - name: Launch both PySide6 desktop shells offscreen
        env:
          PYTHONPATH: equipment_manager
          QT_QPA_PLATFORM: offscreen
        run: python equipment_manager/tests/gui_smoke.py

  windows-package:
    runs-on: windows-latest
    needs: windows-gui-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            equipment_manager/requirements.txt
            equipment_manager/requirements-build.txt
      - name: Build versioned Windows package
        working-directory: equipment_manager
        shell: powershell
        run: ./BUILD_WINDOWS.ps1
      - name: Verify packaged CLI starts
        working-directory: equipment_manager
        shell: powershell
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          & ".\dist\EMS-$version\EMSCLI.exe" version
      - name: Upload EMS Windows package
        uses: actions/upload-artifact@v4
        with:
          name: EMS-Windows-${{ github.sha }}
          path: equipment_manager/dist/EMS-Windows-*.zip
          if-no-files-found: error
          retention-days: 30
