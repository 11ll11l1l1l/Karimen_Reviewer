# Preferred no-server deployment: every Windows PC runs EMS locally.
# Set these environment variables on each workstation:
#
#   EMS_DATA_MODE=network-folder
#   EMS_SHARED_ROOT=\\\\FILESERVER\\EquipmentManagement
#
# EMS keeps SQLite in each workstation's local app-data directory and
# synchronizes committed snapshots through the shared folder. Never place the
# active SQLite file itself on SMB.
#
# Optional overrides:
#   EMS_LOCAL_STATE_ROOT=C:\\Users\\<user>\\AppData\\Local\\EquipmentManagement
#   EMS_FILE_ROOT=\\\\FILESERVER\\EquipmentManagement\\Files
#   EMS_BACKUP_ROOT=\\\\FILESERVER\\EquipmentManagement\\Backups
#
# PostgreSQL remains supported for sites that later gain an always-on database
# host, but it is not required for the serverless network-folder topology.

[deployment]
mode = "network-folder"

[files]
shared_root = "\\\\FILESERVER\\EquipmentManagement"
root = "\\\\FILESERVER\\EquipmentManagement\\Files"
controlled_documents = "\\\\FILESERVER\\EquipmentManagement\\Files\\ControlledDocuments"
backups = "\\\\FILESERVER\\EquipmentManagement\\Backups"

[synchronization]
lock_timeout_seconds = 15
stale_lock_seconds = 300
